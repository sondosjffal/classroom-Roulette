name: Build Classroom Roulette EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name Classroom_Roulette_Final Classroom_Roulette_Final.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Classroom-Roulette-Windows-EXE
          path: dist/Classroom_Roulette_Final.exe
